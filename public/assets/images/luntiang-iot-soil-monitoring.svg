<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Luntiang Republika IoT Soil Monitoring System</title>
  <desc id="desc">A stylized soil monitoring dashboard connected to an IoT sensor in a Thai basil field.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c22"/>
      <stop offset="1" stop-color="#123d37"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf5"/>
      <stop offset="1" stop-color="#dfeadd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00100d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1050" cy="110" r="230" fill="#4f8c70" opacity=".18"/>
  <circle cx="80" cy="760" r="310" fill="#9ac56b" opacity=".12"/>

  <g opacity=".9">
    <path d="M0 660C190 590 335 640 490 610s310-42 470 10 240 10 240 10v170H0Z" fill="#173f2c"/>
    <path d="M0 710c220-60 390-20 570-46s360-5 630 46v90H0Z" fill="#0e2c20"/>
  </g>

  <g transform="translate(75 200)">
    <path d="M80 390V185" stroke="#dfeadd" stroke-width="8" stroke-linecap="round"/>
    <rect x="42" y="105" width="76" height="95" rx="12" fill="#e6efe1" stroke="#9ac56b" stroke-width="5"/>
    <circle cx="80" cy="138" r="10" fill="#52b788"/>
    <path d="M80 200v118" stroke="#8a6a45" stroke-width="7"/>
    <path d="M80 260c-38-46-68-32-72-7 30 10 54 13 72 7Zm0 0c38-46 68-32 72-7-30 10-54 13-72 7Zm0 50c-31-36-56-25-60-5 25 9 44 11 60 5Zm0 0c31-36 56-25 60-5-25 9-44 11-60 5Z" fill="#74b84e"/>
    <path d="M14 390h132" stroke="#8a6a45" stroke-width="12" stroke-linecap="round"/>
  </g>

  <path d="M195 300C300 215 330 165 430 178" fill="none" stroke="#6ecb98" stroke-width="4" stroke-dasharray="12 14"/>
  <circle cx="195" cy="300" r="8" fill="#9ee6b8"/>
  <circle cx="430" cy="178" r="8" fill="#9ee6b8"/>

  <g transform="translate(405 100)" filter="url(#shadow)">
    <rect width="710" height="505" rx="30" fill="url(#panel)"/>
    <rect width="710" height="74" rx="30" fill="#123d37"/>
    <path d="M0 45h710v29H0Z" fill="#123d37"/>
    <circle cx="42" cy="37" r="9" fill="#9ac56b"/>
    <text x="70" y="45" fill="#f4f7ef" font-family="Arial, sans-serif" font-size="22" font-weight="700">LUNTIANG SOIL MONITOR</text>
    <rect x="540" y="22" width="135" height="31" rx="15" fill="#245b48"/>
    <circle cx="561" cy="37" r="6" fill="#8de58c"/>
    <text x="576" y="42" fill="#dff5df" font-family="Arial, sans-serif" font-size="13">DEVICE ONLINE</text>

    <text x="35" y="112" fill="#16372e" font-family="Arial, sans-serif" font-size="18" font-weight="700">THAI BASIL · ZONE 01</text>
    <text x="35" y="137" fill="#60766d" font-family="Arial, sans-serif" font-size="13">Latest calibrated soil reading</text>

    <g font-family="Arial, sans-serif">
      <g transform="translate(35 165)">
        <rect width="145" height="105" rx="16" fill="#fff"/>
        <text x="18" y="27" fill="#6a7d74" font-size="12" font-weight="700">NITROGEN</text>
        <text x="18" y="70" fill="#173f2c" font-size="31" font-weight="700">42</text>
        <text x="66" y="69" fill="#6a7d74" font-size="13">mg/kg</text>
        <rect x="18" y="85" width="90" height="7" rx="4" fill="#d7e4d6"/>
        <rect x="18" y="85" width="61" height="7" rx="4" fill="#59a96a"/>
      </g>
      <g transform="translate(195 165)">
        <rect width="145" height="105" rx="16" fill="#fff"/>
        <text x="18" y="27" fill="#6a7d74" font-size="12" font-weight="700">PHOSPHORUS</text>
        <text x="18" y="70" fill="#173f2c" font-size="31" font-weight="700">18</text>
        <text x="66" y="69" fill="#6a7d74" font-size="13">mg/kg</text>
        <rect x="18" y="85" width="90" height="7" rx="4" fill="#d7e4d6"/>
        <rect x="18" y="85" width="42" height="7" rx="4" fill="#d6a94f"/>
      </g>
      <g transform="translate(355 165)">
        <rect width="145" height="105" rx="16" fill="#fff"/>
        <text x="18" y="27" fill="#6a7d74" font-size="12" font-weight="700">POTASSIUM</text>
        <text x="18" y="70" fill="#173f2c" font-size="31" font-weight="700">36</text>
        <text x="66" y="69" fill="#6a7d74" font-size="13">mg/kg</text>
        <rect x="18" y="85" width="90" height="7" rx="4" fill="#d7e4d6"/>
        <rect x="18" y="85" width="57" height="7" rx="4" fill="#59a96a"/>
      </g>
      <g transform="translate(515 165)">
        <rect width="160" height="105" rx="16" fill="#173f2c"/>
        <text x="18" y="27" fill="#b8d1c5" font-size="12" font-weight="700">SOIL STATUS</text>
        <text x="18" y="63" fill="#e9f7e6" font-size="21" font-weight="700">GOOD</text>
        <text x="18" y="85" fill="#8de58c" font-size="12">Within target range</text>
      </g>
    </g>

    <g transform="translate(35 295)">
      <rect width="420" height="170" rx="16" fill="#fff"/>
      <text x="18" y="29" fill="#173f2c" font-family="Arial, sans-serif" font-size="14" font-weight="700">MOISTURE TREND</text>
      <path d="M20 135h375M20 95h375M20 55h375" stroke="#dfe8df" stroke-width="2"/>
      <path d="M25 125c55-15 76-46 118-37s58 39 101 12 75-12 105-34 40-11 45-19" fill="none" stroke="#398b66" stroke-width="5" stroke-linecap="round"/>
      <path d="M25 125c55-15 76-46 118-37s58 39 101 12 75-12 105-34 40-11 45-19v91H25Z" fill="#59a96a" opacity=".12"/>
    </g>

    <g transform="translate(475 295)" font-family="Arial, sans-serif">
      <rect width="200" height="170" rx="16" fill="#fff"/>
      <text x="18" y="29" fill="#173f2c" font-size="14" font-weight="700">LIVE CONDITIONS</text>
      <circle cx="53" cy="80" r="28" fill="#e4f3ea"/>
      <text x="36" y="86" fill="#398b66" font-size="18" font-weight="700">6.5</text>
      <text x="91" y="76" fill="#6a7d74" font-size="12" font-weight="700">SOIL pH</text>
      <text x="91" y="96" fill="#173f2c" font-size="16" font-weight="700">Optimal</text>
      <path d="M18 118h164" stroke="#e1e9e1"/>
      <text x="18" y="143" fill="#6a7d74" font-size="12" font-weight="700">MOISTURE</text>
      <text x="143" y="143" fill="#173f2c" font-size="16" font-weight="700">64%</text>
    </g>
  </g>

  <text x="75" y="720" fill="#e9f7e6" font-family="Arial, sans-serif" font-size="38" font-weight="700">FROM SOIL TO INSIGHT.</text>
  <text x="77" y="754" fill="#a9c8b7" font-family="Arial, sans-serif" font-size="18">IoT-enabled monitoring for smarter Thai basil cultivation</text>
</svg>
